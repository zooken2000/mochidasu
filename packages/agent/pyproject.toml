[tool.coverage.run]
branch = true
source = [ "mochidasu_agent" ]

[tool.coverage.report]
exclude_lines = [ "if TYPE_CHECKING:" ]
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../coverage/packages/agent/html'
 --cov-report xml:'../../coverage/packages/agent/coverage.xml'
 --html='../../reports/packages/agent/unittests/html/index.html'
 --junitxml='../../reports/packages/agent/unittests/junit.xml'
"""

[tool.hatch.build.targets.wheel]
packages = [ "mochidasu_agent" ]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
exclude = [ ".ruff_cache", ".svn", ".tox", ".venv", "dist" ]
line-length = 120
indent-width = 4

  [tool.ruff.lint]
  select = [ "E", "F", "UP", "B", "SIM", "I" ]
  ignore = [ ]
  fixable = [ "ALL" ]
  unfixable = [ ]

[tool.uv.sources.mochidasu-agent-connection]
workspace = true

[project]
name = "mochidasu-agent"
version = "1.0.0"
description = "Automatically generated by Nx."
requires-python = ">=3.14"
readme = "README.md"
dependencies = [
  "mochidasu-agent-connection",
  "aws-lambda-powertools==3.34.0",
  "aws-opentelemetry-distro==0.19.0",
  "bedrock-agentcore==1.22.0",
  "boto3==1.43.89",
  "fastapi==0.141.1",
  "mcp==1.28.1",
  "strands-agents==1.54.0",
  "uvicorn==0.52.4"
]

[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"

[dependency-groups]
dev = [ "fastapi[standard]==0.141.1" ]
